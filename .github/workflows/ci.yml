name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=github/gh-actions-lock
          GH_ACTIONS_LOCK_VERSION: v0.5.1
        # Not --fail-on-warning: workflows pin actions by full SHA with a `# vN`
        # comment, which the tool reports as a "sha-as-ref" warning.
        run: |
          gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION" --force
          gh actions-lock --verify

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
      - name: Run hk test
        run: hk test
      - name: Smoke test commit-msg hook rejects a message without emoji
        run: |
          echo "no emoji here" > /tmp/msg.txt
          if hk run commit-msg /tmp/msg.txt; then
            echo "expected commit-msg hook to fail" >&2
            exit 1
          fi
      - name: "Smoke test commit-msg hook accepts a :emoji: message"
        run: |
          echo ":sparkles: add feature" > /tmp/msg.txt
          hk run commit-msg /tmp/msg.txt
      - name: Smoke test prepare-commit-msg hook prefixes merge commits
        run: |
          echo "Merge branch 'foo'" > /tmp/msg.txt
          hk run prepare-commit-msg /tmp/msg.txt merge deadbeef
          grep -qF ":inbox_tray: Merge branch 'foo'" /tmp/msg.txt
